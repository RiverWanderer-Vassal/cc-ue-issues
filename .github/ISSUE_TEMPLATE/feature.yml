name: "Request a feature"
description: "Something you would like a UE module to do, or to do differently (not a fault: use the module's problem form for those)."
title: "[Feature] "
labels: ["feature", "needs-triage"]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Filled in by the module's Help menu.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do, and why it would help your games.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How might it work?
      description: Optional. Where in the module it would go, or how another module does it.
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Screenshots or sketches, if any.
  - type: textarea
    id: environment
    attributes:
      label: Module, VASSAL and computer
      description: Filled in by the module's Help menu.
