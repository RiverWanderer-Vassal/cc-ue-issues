name: "Training report: the computer opponent"
description: "Your comments on the computer's moves in a UE module game. The module's Send training report button fills most of this in for you."
title: "[Training] "
labels: ["training", "to-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for coaching the computer. Please **attach the zip** the module prepared (named in the Files box below):
        its game log replays the game exactly, so each comment can be looked at in the position you saw.
        Sending this report makes the game public training data; it holds no player names and no chat.
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - "Commands & Colors: Napoleonics UE"
        - "Commands & Colors: Ancients UE"
        - "Commands & Colors: Medieval UE"
        - "Commands & Colors: Samurai Battles UE"
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario
      placeholder: e.g. 001 Akragas - 406 BC
  - type: input
    id: opponent
    attributes:
      label: The computer opponent
      description: Filled in by the module (its kind and level, and the side it played).
      placeholder: e.g. Stronger, playing the French
  - type: input
    id: summary
    attributes:
      label: Comments
      description: Filled in by the module (how many, by verdict).
      placeholder: e.g. 3 mistakes, 1 doubtful, 2 good moves
  - type: textarea
    id: comments
    attributes:
      label: Your comments
      description: "Filled in by the module, one block per comment: the turn, what the computer did and why, your verdict, what you would have done, and your reasons. For a long game, paste them from the clipboard (they are copied there for you)."
      render: text
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: "Drag in the zip the module prepared (the game log and saved game)."
  - type: textarea
    id: environment
    attributes:
      label: Module, VASSAL and computer
      description: Filled in by the module.
  - type: textarea
    id: record
    attributes:
      label: Game record
      description: "Filled in by the module, or pasted from the clipboard: every action of the game, so it replays exactly."
      render: text
